name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild and restart on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/Housing-Estimator
            git fetch --prune origin
            git reset --hard origin/main
            # .env is untracked, so reset --hard leaves it alone.
            test -d venv || python3 -m venv venv
            ./venv/bin/pip install --quiet --upgrade pip
            ./venv/bin/pip install --quiet -r requirements.txt
            sudo systemctl restart housing-estimator
            sleep 3
            systemctl is-active --quiet housing-estimator \
              || { journalctl -u housing-estimator -n 40 --no-pager; exit 1; }
            curl -fsS -o /dev/null http://127.0.0.1:8000/ && echo "deploy OK"
