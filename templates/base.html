<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Home Value Estimator{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#127968;</text></svg>">
</head>
<body>
  <main class="shell">
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">
    <p>Estimates are statistical, generated from nearby listing data. Not an appraisal,
       and not affiliated with or endorsed by Zillow.</p>
    <p class="copyright">&copy; {{ year }} wolfatthegate.com. All rights reserved.</p>
  </footer>
</body>
</html>
