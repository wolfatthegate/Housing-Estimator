services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      # Absent on a first boot before you've written it; the app falls back to
      # the offline synthetic provider rather than refusing to start.
      - path: .env
        required: false
    volumes:
      # Persist the geocode cache across deploys so we don't re-hit Nominatim.
      - cache:/app/.cache
    # Loopback only. TLS and virtual hosting are the shared Caddy's job --
    # see deploy/housing-estimator.caddy. Publishing this on 0.0.0.0 would
    # expose the app un-proxied on port 8000.
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  cache:
